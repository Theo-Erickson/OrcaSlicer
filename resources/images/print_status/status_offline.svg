<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <style>
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .zzz1 { animation: pulse 2s ease-in-out infinite 0.0s; }
    .zzz2 { animation: pulse 2s ease-in-out infinite 0.5s; }
    .zzz3 { animation: pulse 2s ease-in-out infinite 1.0s; }
    @media (prefers-reduced-motion: reduce) {
      .zzz1, .zzz2, .zzz3 { animation: none; }
    }
  </style>
  <!-- Dashed hexagon = unavailable -->
  <polygon points="36,10 56,22 56,50 36,62 16,50 16,22"
    fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- Faded wifi/signal arcs -->
  <path d="M24 40 Q36 28 48 40"
    fill="none" stroke="#D3D1C7" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M28 44 Q36 36 44 44"
    fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round"/>
  <!-- X over signal -->
  <line x1="28" y1="28" x2="44" y2="44"
    stroke="#888780" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="28" x2="28" y2="44"
    stroke="#888780" stroke-width="2" stroke-linecap="round"/>
  <!-- Sleeping axolotl -->
  <circle cx="36" cy="56" r="5" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
  <!-- Closed eyes -->
  <path d="M33 55 Q34 54 35 55" fill="none" stroke="#5F5E5A" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M37 55 Q38 54 39 55" fill="none" stroke="#5F5E5A" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Z z z -->
  <text class="zzz1" x="44" y="52" font-size="8"  fill="#B4B2A9" font-family="sans-serif" font-weight="500">z</text>
  <text class="zzz2" x="48" y="46" font-size="10" fill="#D3D1C7" font-family="sans-serif" font-weight="500">z</text>
  <text class="zzz3" x="53" y="39" font-size="12" fill="#D3D1C7" font-family="sans-serif" font-weight="500">z</text>
</svg>
