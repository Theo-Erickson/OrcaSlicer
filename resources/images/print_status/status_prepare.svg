<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <style>
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .heat-pulse { animation: pulse 1.5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .heat-pulse { animation: none; } }
  </style>
  <!-- Dashed outer ring -->
  <circle cx="36" cy="36" r="22"
    fill="none" stroke="#BA7517" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- Outer triangle -->
  <polygon points="36,20 48,42 24,42"
    fill="none" stroke="#EF9F27" stroke-width="1.5"/>
  <!-- Inner triangle fill -->
  <polygon points="36,26 44,40 28,40"
    fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <!-- Thermometer body -->
  <rect x="33" y="28" width="6" height="12" rx="3"
    fill="none" stroke="#BA7517" stroke-width="1"/>
  <!-- Thermometer mercury - animates -->
  <rect class="heat-pulse"
    x="34.5" y="34" width="3" height="6" rx="1.5" fill="#EF9F27"/>
  <!-- Axolotl eyes -->
  <circle cx="32" cy="46" r="1.2" fill="#854F0B"/>
  <circle cx="40" cy="46" r="1.2" fill="#854F0B"/>
  <!-- Gills -->
  <line x1="24" y1="42" x2="18" y2="36" stroke="#FAC775" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="42" x2="54" y2="36" stroke="#FAC775" stroke-width="1.5" stroke-linecap="round"/>
</svg>
