<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <style>
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }
    @keyframes layer-rise {
      0%   { transform: translateY(0);  opacity: 0.6; }
      100% { transform: translateY(-6px); opacity: 0; }
    }
    .nozzle       { animation: bob 1.5s ease-in-out infinite; transform-origin: 36px 30px; }
    .extrude-dot  { animation: pulse 0.8s ease-in-out infinite; }
    .new-layer    { animation: layer-rise 2s ease-out infinite; transform-origin: 36px 36px; }
    @media (prefers-reduced-motion: reduce) {
      .nozzle, .extrude-dot, .new-layer { animation: none; }
    }
  </style>
  <!-- Hexagonal frame -->
  <polygon points="36,10 56,22 56,50 36,62 16,50 16,22"
    fill="none" stroke="#0F6E56" stroke-width="1.5"/>
  <!-- Completed layer stack -->
  <rect x="23" y="46" width="26" height="4" rx="1" fill="#5DCAA5"/>
  <rect x="23" y="40" width="26" height="4" rx="1" fill="#5DCAA5" opacity="0.8"/>
  <!-- Newest layer animating up -->
  <rect class="new-layer"
    x="23" y="34" width="20" height="4" rx="1" fill="#5DCAA5" opacity="0.6"/>
  <!-- Print nozzle with axolotl face -->
  <g class="nozzle">
    <polygon points="31,24 41,24 39,31 33,31" fill="#1D9E75"/>
    <circle cx="34" cy="26" r="1.2" fill="#085041"/>
    <circle cx="38" cy="26" r="1.2" fill="#085041"/>
  </g>
  <!-- Extrusion filament dot -->
  <circle class="extrude-dot"
    cx="36" cy="34" r="1.5" fill="#9FE1CB"/>
  <!-- Gills -->
  <line x1="16" y1="30" x2="9"  y2="24" stroke="#9FE1CB" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="36" x2="8"  y2="34" stroke="#9FE1CB" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="30" x2="63" y2="24" stroke="#9FE1CB" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="36" x2="64" y2="34" stroke="#9FE1CB" stroke-width="1.5" stroke-linecap="round"/>
</svg>
