<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <style>
    @keyframes dash { to { stroke-dashoffset: -40; } }
    @keyframes scan { 0% { transform: translateY(0); } 100% { transform: translateY(22px); } }
    .spin-dash { animation: dash 1.5s linear infinite; }
    .scan-line { animation: scan 1.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .spin-dash { animation: none; }
      .scan-line { animation: none; }
    }
  </style>
  <!-- Rotating dashed hexagon -->
  <polygon class="spin-dash"
    points="36,10 52,20 52,52 36,62 20,52 20,20"
    fill="none" stroke="#1D9E75" stroke-width="1" stroke-dasharray="5 3"/>
  <!-- Layer stack -->
  <rect x="24" y="44" width="24" height="4" rx="1" fill="#5DCAA5" opacity="0.9"/>
  <rect x="24" y="38" width="24" height="4" rx="1" fill="#5DCAA5" opacity="0.7"/>
  <rect x="24" y="32" width="24" height="4" rx="1" fill="#5DCAA5" opacity="0.5"/>
  <rect x="24" y="26" width="24" height="4" rx="1" fill="#5DCAA5" opacity="0.3"/>
  <!-- Scanning laser line -->
  <line class="scan-line"
    x1="18" y1="32" x2="54" y2="32"
    stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Axolotl face on top frame -->
  <circle cx="36" cy="20" r="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8"/>
  <circle cx="34" cy="19" r="1.2" fill="#0F6E56"/>
  <circle cx="38" cy="19" r="1.2" fill="#0F6E56"/>
  <path d="M34 22 Q36 24 38 22" fill="none" stroke="#0F6E56" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Gills -->
  <line x1="30" y1="17" x2="27" y2="13" stroke="#9FE1CB" stroke-width="1" stroke-linecap="round"/>
  <line x1="42" y1="17" x2="45" y2="13" stroke="#9FE1CB" stroke-width="1" stroke-linecap="round"/>
</svg>
