<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <style>
    @keyframes spin     { to { transform: rotate(360deg);  } }
    @keyframes spin-ccw { to { transform: rotate(-360deg); } }
    .cal-cross  { animation: spin     3s linear infinite; transform-origin: 36px 36px; }
    .cal-dots   { animation: spin-ccw 2s linear infinite; transform-origin: 36px 36px; }
    @media (prefers-reduced-motion: reduce) {
      .cal-cross, .cal-dots { animation: none; }
    }
  </style>
  <!-- Outer dashed ring -->
  <circle cx="36" cy="36" r="22"
    fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="2 4"/>
  <!-- Rotating cross/crosshair -->
  <g class="cal-cross">
    <line x1="36" y1="14" x2="36" y2="58" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14" y1="36" x2="58" y2="36" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="52" y2="52" stroke="#5F5E5A" stroke-width="1"   stroke-linecap="round" opacity="0.5"/>
    <line x1="52" y1="20" x2="20" y2="52" stroke="#5F5E5A" stroke-width="1"   stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- CCW orbiting dots -->
  <g class="cal-dots">
    <circle cx="36" cy="14" r="2.5" fill="#B4B2A9"/>
    <circle cx="58" cy="36" r="2.5" fill="#B4B2A9"/>
    <circle cx="36" cy="58" r="2.5" fill="#B4B2A9"/>
    <circle cx="14" cy="36" r="2.5" fill="#B4B2A9"/>
  </g>
  <!-- Target center -->
  <circle cx="36" cy="36" r="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <circle cx="36" cy="36" r="4" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.8"/>
  <!-- Axolotl eyes inside target -->
  <circle cx="34.5" cy="35" r="1" fill="#2C2C2A"/>
  <circle cx="37.5" cy="35" r="1" fill="#2C2C2A"/>
</svg>
