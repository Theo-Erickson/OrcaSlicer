<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .spool-spin {
      animation: spin 4s linear infinite;
      transform-origin: 36px 36px;
    }
    @media (prefers-reduced-motion: reduce) { .spool-spin { animation: none; } }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Outer spool ring -->
  <circle cx="36" cy="36" r="20"
    fill="none" stroke="#534AB7" stroke-width="1.5"/>
  <!-- Inner hub -->
  <circle cx="36" cy="36" r="8"
    fill="none" stroke="#534AB7" stroke-width="1"/>
  <!-- Spinning filament strands -->
  <g class="spool-spin">
    <path d="M36 16 Q50 20 56 36 Q50 52 36 56 Q22 52 16 36 Q22 20 36 16"
      fill="none" stroke="#7F77DD" stroke-width="2" stroke-dasharray="6 3"/>
  </g>
  <!-- Axolotl face in hub -->
  <circle cx="36" cy="36" r="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <circle cx="34" cy="35" r="1"   fill="#3C3489"/>
  <circle cx="38" cy="35" r="1"   fill="#3C3489"/>
  <path d="M34 38 Q36 40 38 38"
    fill="none" stroke="#3C3489" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Color-change arrows -->
  <path d="M22 20 L28 26"
    fill="none" stroke="#534AB7" stroke-width="1.5"
    stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <path d="M50 20 L44 26"
    fill="none" stroke="#D85A30" stroke-width="1.5"
    stroke-linecap="round"/>
</svg>
