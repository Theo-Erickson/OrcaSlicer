<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
  <!-- Document body -->
  <rect x="2" y="2" width="12" height="16" rx="1"
        fill="none" stroke="white" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Document lines -->
  <line x1="4.5" y1="6"  x2="11.5" y2="6"  stroke="white" stroke-width="1" stroke-linecap="round"/>
  <line x1="4.5" y1="9"  x2="11.5" y2="9"  stroke="white" stroke-width="1" stroke-linecap="round"/>
  <line x1="4.5" y1="12" x2="9"    y2="12" stroke="white" stroke-width="1" stroke-linecap="round"/>
  <line x1="4.5" y1="15" x2="11.5" y2="15" stroke="white" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <!-- Magnifier circle -->
  <circle cx="10" cy="9" r="4.5"
          fill="none" stroke="white" stroke-width="1.2"/>
  <!-- Magnifier handle -->
  <line x1="13.2" y1="12.2" x2="16.5" y2="15.5"
        stroke="white" stroke-width="1.5" stroke-linecap="round"/>
</svg>
